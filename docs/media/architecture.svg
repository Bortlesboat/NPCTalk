<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>NPCTalk: one exchange</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f5f7; stroke: #9aa1ab; stroke-width: 1.5; }
    .game { fill: #eaf3ea; stroke: #6c9e6c; }
    .cloud { fill: #eef1fb; stroke: #7d8cc4; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #57606a; font-size: 12px; }
    .a { stroke: #57606a; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .ah { fill: #57606a; }
    .lbl { fill: #57606a; font-size: 12px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #6e7681; }
      .game { fill: #12261a; stroke: #3f8f55; }
      .cloud { fill: #161c33; stroke: #5b6fbf; }
      .t { fill: #e6edf3; }
      .s, .lbl { fill: #9da7b3; }
      .a { stroke: #9da7b3; }
      .ah { fill: #9da7b3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="420" rx="12"/>

  <!-- row 1: in -->
  <rect class="box game" x="24" y="40" width="160" height="78" rx="10"/>
  <text class="t" x="104" y="72" text-anchor="middle">Player talks</text>
  <text class="s" x="104" y="92" text-anchor="middle">open mic · hold N · type B</text>

  <rect class="box game" x="224" y="40" width="160" height="78" rx="10"/>
  <text class="t" x="304" y="72" text-anchor="middle">Voice activity</text>
  <text class="s" x="304" y="92" text-anchor="middle">vs. the room's noise floor</text>

  <rect class="box cloud" x="424" y="40" width="160" height="78" rx="10"/>
  <text class="t" x="504" y="72" text-anchor="middle">Speech-to-text</text>
  <text class="s" x="504" y="92" text-anchor="middle">fal Nemotron · ~0.4 s</text>

  <rect class="box game" x="624" y="40" width="160" height="78" rx="10"/>
  <text class="t" x="704" y="66" text-anchor="middle">Who + scene</text>
  <text class="s" x="704" y="86" text-anchor="middle">nearest in view · place,</text>
  <text class="s" x="704" y="102" text-anchor="middle">time, weather, gun, car</text>

  <rect class="box cloud" x="816" y="40" width="160" height="78" rx="10"/>
  <text class="t" x="896" y="66" text-anchor="middle">LLM in character</text>
  <text class="s" x="896" y="86" text-anchor="middle">persona + own lines</text>
  <text class="s" x="896" y="102" text-anchor="middle">Cerebras · ~0.3 s</text>

  <path class="a" d="M184 79 H220"/>
  <path class="a" d="M384 79 H420"/>
  <path class="a" d="M584 79 H620"/>
  <path class="a" d="M784 79 H812"/>

  <!-- row 2: out -->
  <rect class="box cloud" x="560" y="200" width="260" height="96" rx="10"/>
  <text class="t" x="690" y="230" text-anchor="middle">Fish Audio voice server</text>
  <text class="s" x="690" y="250" text-anchor="middle">Drama 3 or S2 Pro · Modal H100 · SGLang-Omni</text>
  <text class="s" x="690" y="268" text-anchor="middle">cloned from a reference clip · [tags]</text>
  <text class="s" x="690" y="284" text-anchor="middle">PCM streamed · first audio ~0.4 s</text>

  <rect class="box game" x="140" y="200" width="300" height="96" rx="10"/>
  <text class="t" x="290" y="230" text-anchor="middle">The NPC speaks</text>
  <text class="s" x="290" y="250" text-anchor="middle">panned to the NPC, fades with distance</text>
  <text class="s" x="290" y="268" text-anchor="middle">mouth moves · game-style subtitle</text>
  <text class="s" x="290" y="284" text-anchor="middle">+ the action</text>

  <rect class="box cloud" x="816" y="330" width="160" height="70" rx="10"/>
  <text class="t" x="896" y="358" text-anchor="middle">Action pick</text>
  <text class="s" x="896" y="378" text-anchor="middle">TypeSafe Jev · ~0.1 s</text>

  <rect class="box game" x="140" y="330" width="300" height="70" rx="10"/>
  <text class="t" x="290" y="358" text-anchor="middle">Animation</text>
  <text class="s" x="290" y="378" text-anchor="middle">slap · hug · kneel · flee · ... or nothing</text>

  <path class="a" d="M896 118 V160 H690 V196"/>
  <text class="lbl" x="770" y="152">the line</text>
  <path class="a" d="M556 248 H444"/>
  <text class="lbl" x="462" y="240">streamed audio</text>
  <path class="a" d="M940 118 V326"/>
  <text class="lbl" x="932" y="316" text-anchor="end">in parallel</text>
  <path class="a" d="M812 365 H444"/>
  <path class="a" d="M290 330 V300"/>

  <text class="lbl" x="24" y="160">green: inside the game (the four hooks)</text>
  <text class="lbl" x="24" y="178">blue: services (fal, Cerebras, Modal, TypeSafe)</text>
  <text class="lbl" x="24" y="324">end of sentence → voice: 1.2-2.2 s</text>
</svg>
