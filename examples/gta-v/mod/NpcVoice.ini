; NpcVoice settings. Lives next to NpcVoice.dll in <GTA V>\scripts\

[Tts]
; Voice engine:
;   modal    your Fish Audio server on Modal: Drama 3 (server/drama3.py, the default) or S2 Pro
;            (server/s2pro.py). Streams audio as it's generated, voices [tags], uses the angry/drunk
;            clips. Needs `modal deploy server/drama3.py`, [Modal] Url and the NPCVOICE_TOKEN
;            environment variable. The GPU stops after 5 idle minutes; the first line after that
;            takes a minute or two (keep-warm below avoids it while you play).
;   minimax  fal-ai/minimax/speech-2.8-turbo. Clones each voice once on first use ($1.50, cached in
;            voices/<name>/minimax_voice.txt), ~2.5 s per line, no cold starts, profanity is fine,
;            [tags] become emotions.
;   lux      fal-ai/lux-tts, clones from the reference clip on every call. Very cheap, ~2.5 s per line
;            warm, ~1 min after a few idle minutes (keep-warm below), and its content checker
;            rejects a lot of ordinary GTA swearing.
;   fish     the FishTTS app on fal (server/fal/fal_app.py) over /realtime: streams audio, ~0.4 s to
;            first sound when warm. Needs `fal deploy server/fal/fal_app.py::FishTTS` and [Fal] AppId.
Engine = modal
; Send a tiny line when nothing has been said for this many seconds, so modal/lux/fish stay warm (0 = off)
KeepWarmSeconds = 90
; Engine to use while modal/fish is waking up (cold GPU) or doesn't make a sound within 12 s; empty = wait
Fallback = minimax
; Seconds of the reference clip Lux listens to
LuxReferenceSeconds = 10
; Director clips only (rendered ahead, so no streaming needed), server/drama3.py only: render this many takes
; of each line and keep the one that sounds most like the character's reference clips, never one that
; rambles or trails off (about 1 take in 10 does). 1 = off, at most 8 (8 measured best on Lamar)
DirectorBestOf = 8

[Modal]
; Only for Engine = modal: the endpoint `modal deploy server/drama3.py` prints, without https://
; (ScriptHookVDotNet reads // as the start of a comment)
Url = your-workspace--npcvoice-drama.modal.run
; The bearer token (same value as the npcvoice-auth Modal secret) is read from this environment variable
TokenEnv = NPCVOICE_TOKEN

[Fal]
; Only for Engine = fish: the deployed FishTTS app as printed by `fal deploy` (owner/app-name)
AppId =
; WebSocket route on the app (server/fal/fal_app.py: @fal.realtime("/realtime"))
Path = realtime
; fal key is read from this environment variable; ApiKey below is only a fallback
ApiKeyEnv = FAL_KEY
ApiKey =

[Llm]
; OpenAI-compatible chat endpoint that writes the characters' lines (Cerebras for speed).
; Leave out https:// (ScriptHookVDotNet reads // as the start of a comment); the mod adds it.
BaseUrl = api.cerebras.ai/v1
Model = qwen-3.8-27b
ApiKeyEnv = CEREBRAS_API_KEY
ApiKey =
MaxTokens = 160
Temperature = 0.9
; Cerebras: skip hidden reasoning so the line comes back in ~0.3 s
DisableReasoning = true
; Only for reasoning models that can't disable it (e.g. gpt-oss-120b: low)
ReasoningEffort =

[Stt]
; fal speech-to-text endpoint for hold-B voice input (returns "output" or "text")
Endpoint = nvidia/nemotron-asr-multilingual/asr

[Voices]
; Voices (folders in NpcVoice\voices) for NPCs without a character file, picked by gender
MalePool = Hillbilly, Marine
FemalePool = FemaleCop

[Keys]
; Walk up to someone and press to type what you say
Type = B
; Hold while you talk into your mic, release to send (N is push-to-talk in GTA Online too)
PushToTalk = N
; Turn the open mic (always listening, below) off and on
MicToggle = M
; Dev mode: talk scene with every character, menu to go to any of them, timings
DevMode = F9
; In dev mode: hide or show its menu (top left) and timings (top right); dev mode stays on
DevPanels = F10
; Go to a main character's home, with the people who live there to talk to (works outside dev mode)
VisitMichael = J
VisitFranklin = K
VisitTrevor = L
; Turn the mod on/off
Toggle = F7
; Make the nearest NPC say an ambient line right now (for testing)
Test = F8

[Mic]
; Open mic: always listening, so you just talk to whoever's near you (in or out of dev mode). It pauses
; while an NPC talks so their voice from the speakers isn't heard as yours; headphones work best.
OpenMic = true
; How many dB above the background noise counts as you talking (raise it if the game sets it off)
SensitivityDb = 12
; How long a pause (ms) ends what you're saying
SilenceMs = 700

[Actions]
; NPCs act out what they say (punch, slap, pull a gun, hug, kiss, flip you off, beg, run off...). TypeSafe's
; Jev picks the action from your words and their reply; the key comes from the TYPESAFE_API_KEY variable.
; In dev mode: PgUp/PgDn pick an action, End makes your target do it, [ and ] save their shirt-off / pants-off look.
Enabled = true
ApiKeyEnv = TYPESAFE_API_KEY
ApiKey =
; Without https:// (ScriptHookVDotNet reads // as the start of a comment)
BaseUrl = api.typesafe.ai
Model = jev-latest

[Dev]
; Open dev mode as soon as story mode loads: you land in the talk scene straight away
AutoStart = true
; Where the scene is (x, y, z) and which way you face. Default: Legion Square, Downtown Los Santos
Location = 215.76, -810.12, 30.73
Heading = 160
; Characters spawned around you, first one in front of you (files in NpcVoice\characters)
Scene = Franklin, Michael, Trevor, LamarDavis, LesterCrest, AmandaTownley, JimmyDisanto, TracyDisanto, DaveNorton, SiemonYetarian, Cop01SFY, Hillbilly01AMM, Marine02SMY

[Npc]
; Ambient mode: NPCs within Radius that start a built-in voice line are muted and say an AI line instead
Ambient = false
Radius = 25
; Seconds before the same NPC can get another ambient line
CooldownSeconds = 8
Subtitles = true

[Audio]
; Metres from the camera where the voice starts fading, and where it is silent
FadeStart = 4
FadeEnd = 30
