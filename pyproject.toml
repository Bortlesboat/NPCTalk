[project]
name = "npctalk"
version = "0.1.0"
description = "Make any NPC in any game talk with Fish Audio: test a voice server, make reference voices, and check a project before publishing it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
npctalk = "npctalk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["npctalk"]
